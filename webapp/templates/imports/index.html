{% extends 'base.html' %}{% block title %}Nhập kho{% endblock %}{% block main_content %}<div class="import-page"><h1>📥 Nhập kho</h1><div class="warehouse"><div class="products-section"><div class="filters"><input id="search" type="text" placeholder="Tìm sản phẩm..."><select id="category-filter"><option value="">Tất cả danh mục</option>{% for p in products %}{% if p.category_name and p.category_name not in category_list %}{% set _ = category_list.append(p.category_name) %}{% endif %}{% endfor %}</select></div><div id="products" class="products">{% for p in products %}<div class="product" data-product-id="{{ p.id }}" data-name="{{ p.name }}" data-sku="{{ p.sku }}" data-unit="{{ p.unit }}" data-price="{{ p.cost_price }}"><h3>{{ p.name }}</h3><small class="muted">{{ p.sku }}</small><p class="muted">Đơn vị: {{ p.unit }} | Giá vốn: {{ p.cost_price|number_format }} ₫</p><div class="quantity"><button class="btn-minus">−</button><input type="number" class="qty-input" value="0" min="0"><button class="btn-plus">+</button><input type="number" class="price-input" value="{{ p.cost_price }}" placeholder="Giá nhập" step="1000"></div></div>{% endfor %}</div></div><div class="cart"><h2>📋 Phiếu nhập</h2><div id="cart-items"></div><div class="cart-total"><strong>Tổng giá trị:</strong> <span id="total-value">0 ₫</span></div><form method="post" action="/nhap-kho/xac-nhan" id="import-form"><input type="hidden" name="items_json" id="items_json"><div class="form-group"><label>Nhà cung cấp:</label><select name="supplier_id"><option value="">-- Chọn --</option>{% for s in suppliers %}<option value="{{ s.id }}">{{ s.name }}</option>{% endfor %}</select></div><div class="form-group"><label>Ghi chú:</label><textarea name="note" rows="2" placeholder="Ghi chú phiếu nhập..."></textarea></div><button type="submit" class="primary" style="width:100%">Xác nhận nhập kho</button></form></div></div></div><style>.import-page{display:grid;gap:24px}.products-section{display:grid;gap:16px}.quantity{align-items:center}.quantity .price-input{flex:1;border-radius:8px;border:1px solid var(--border);padding:8px}.cart-total{margin-top:16px;padding-top:16px;border-top:2px solid var(--border);font-size:1.1rem}.form-group{margin:12px 0}.form-group label{display:block;margin-bottom:6px;font-weight:500}.form-group select,.form-group textarea{width:100%;max-width:100%}</style><script>{% set category_list = [] %}document.addEventListener('DOMContentLoaded',function(){const cart={};const productsEl=document.getElementById('products');const searchInput=document.getElementById('search');function renderCart(){const cartItems=document.getElementById('cart-items');cartItems.innerHTML='';let total=0;for(const[id,item]of Object.entries(cart)){if(item.quantity>0){const lineTotal=item.quantity*item.price;total+=lineTotal;cartItems.innerHTML+=`<div class="cart-line"><span>${item.name} x${item.quantity}</span><span>${(lineTotal).toLocaleString('vi-VN')} ₫</span><button class="link-button danger" onclick="removeItem('${id}')">×</button></div>`}}document.getElementById('total-value').textContent=total.toLocaleString('vi-VN')+' ₫';document.getElementById('items_json').value=JSON.stringify(Object.entries(cart).map(([id,item])=>({product_id:parseInt(id),quantity:item.quantity,unit_price:item.price})).filter(i=>i.quantity>0))}window.removeItem=function(id){delete cart[id];renderCart()};productsEl.addEventListener('click',function(e){if(e.target.classList.contains('btn-plus')){const card=e.target.closest('.product');const id=card.dataset.productId;const qtyInput=card.querySelector('.qty-input');const priceInput=card.querySelector('.price-input');if(!cart[id]){cart[id]={name:card.dataset.name,quantity:0,price:parseFloat(priceInput.value)||0}}cart[id].quantity+=1;qtyInput.value=cart[id].quantity;renderCart()}else if(e.target.classList.contains('btn-minus')){const card=e.target.closest('.product');const id=card.dataset.productId;const qtyInput=card.querySelector('.qty-input');if(cart[id]&&cart[id].quantity>0){cart[id].quantity-=1;qtyInput.value=cart[id].quantity;if(cart[id].quantity===0){delete cart[id]}renderCart()}}});productsEl.addEventListener('change',function(e){if(e.target.classList.contains('price-input')){const card=e.target.closest('.product');const id=card.dataset.productId;if(!cart[id]){cart[id]={name:card.dataset.name,quantity:0,price:parseFloat(e.target.value)||0}}else{cart[id].price=parseFloat(e.target.value)||0}renderCart()}});document.getElementById('import-form').addEventListener('submit',function(e){const items=Object.entries(cart).map(([id,item])=>({product_id:parseInt(id),quantity:item.quantity,unit_price:item.price})).filter(i=>i.quantity>0);if(items.length===0){e.preventDefault();alert('Vui lòng chọn ít nhất một sản phẩm');return}document.getElementById('items_json').value=JSON.stringify(items)});searchInput.addEventListener('input',function(e){const query=e.target.value.toLowerCase();document.querySelectorAll('.product').forEach(card=>{const name=card.dataset.name.toLowerCase();const sku=card.dataset.sku.toLowerCase();card.style.display=name.includes(query)||sku.includes(query)?'':'none'})})});</script>{% endblock %}
