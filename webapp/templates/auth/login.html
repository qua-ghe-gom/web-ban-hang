{% extends 'base.html' %}{% block title %}Đăng nhập{% endblock %}{% block login_content %}
<section class="login-card"><h1>{{ app_name|upper }}</h1><h2>Đăng nhập</h2>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<label>Tên đăng nhập<input name="username" required autocomplete="username"></label>
<label>Mật khẩu<input type="password" name="password" required autocomplete="current-password"></label>
<button class="primary" type="submit">Đăng nhập</button></form></section>{% endblock login_content %}
